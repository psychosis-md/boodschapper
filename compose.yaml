# Local development database. Start with: docker compose up -d postgres
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: boodschapper
      POSTGRES_USER: boodschapper
      POSTGRES_PASSWORD: boodschapper
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boodschapper -d boodschapper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
